name: Continuous Deployment to Google Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_ID: dark-bindery-466613-u2
  REGION: asia-south1

jobs:
  deploy:
    name: Deploy Microservices to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Spring Boot Backend (soa-backend)
        run: |
          gcloud run deploy soa-backend \
            --source backend \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --port 5000 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --quiet

      - name: Deploy React Frontend (soa-frontend)
        run: |
          gcloud run deploy soa-frontend \
            --source frontend \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --port 80 \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --quiet
